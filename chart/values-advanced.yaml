# Advanced defaults, loaded automatically by the chart.
# Override any key in your own values file using its path below.
# Maps merge recursively, except probe objects which replace their defaults.
# Lists replace the entire default list.
# Keep credentials in a private override file or use existingSecret.

# Container security and health checks. See README.md#security-and-workload-controls.
core:
  extraVolumes: []
  extraVolumeMounts: []
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  startupProbe:
    tcpSocket:
      port: api
    periodSeconds: 5
    failureThreshold: 60
  readinessProbe:
    tcpSocket:
      port: api
    periodSeconds: 10
  livenessProbe: {}

postgres:
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["NET_RAW"]
    seccompProfile:
      type: RuntimeDefault
  startupProbe:
    exec:
      command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
    failureThreshold: 60
    periodSeconds: 5
  readinessProbe:
    exec:
      command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
    periodSeconds: 10
  livenessProbe: {}

# Broker queues, authentication caches, connection pools, and SQL queries.
mqtt:
  # Merged over broker defaults; HiveMQ drops ALL capabilities.
  securityContext: {}
  # Null uses the built-in TCP probe defaults; {} disables the probe.
  startupProbe: null
  readinessProbe: null
  livenessProbe: null
  cache:
    enabled: true
    reset: true
    refresh: true
    authSeconds: 300
    aclSeconds: 300
    authJitterSeconds: 15
    aclJitterSeconds: 15
  mosquitto:
    allowLocalSysRead: false
    queueQos0Messages: false
    autosaveInterval: 1800
    image:
      repository: "ghcr.io/lhns/mosquitto-go-auth"
      pullPolicy: "IfNotPresent"
    maxQueuedMessages: 200000
    maxQueuedBytes: 0
    maxConnections: -1
    # PostgreSQL placeholders: $1 = username; ACL $2 = access (1/4 subscribe, 2 publish).
    queries:
      password: "SELECT password_hash FROM aiida.aiida_mqtt_user WHERE username = $1 LIMIT 1;"
      superuser: "SELECT count(*) FROM aiida.aiida_mqtt_user WHERE username = $1 AND is_superuser = true;"
      acl: "SELECT topic FROM aiida.aiida_mqtt_acl WHERE username = $1 AND acl_type = 'ALLOW' AND (($2 = 2 AND action = 'PUBLISH') OR ($2 IN (1,4) AND action = 'SUBSCRIBE'));"
  hivemq:
    image:
      repository: "ghcr.io/flexidata-at/eddie-mqtt-auth-hivemq"
      pullPolicy: "IfNotPresent"
    maxConnections: -1
    maxQueuedMessages: 200000
    cacheMaximumEntries: 10000
    callbackTimeoutMs: 5000
    maximumUsernameBytes: 1024
    maximumPasswordBytes: 4096
    database:
      poolMaximumSize: 4
      poolMinimumIdle: 0
      connectionTimeoutMs: 3000
      validationTimeoutMs: 2000
      idleTimeoutMs: 600000
      maxLifetimeMs: 1800000
      queryTimeoutSeconds: 3
    localSuperuser:
      enabled: true
    queries:
      password: "SELECT password_hash FROM aiida.aiida_mqtt_user WHERE username = ? LIMIT 1;"
      superuser: "SELECT count(*) FROM aiida.aiida_mqtt_user WHERE username = ? AND is_superuser = true;"
      acl: "SELECT topic FROM aiida.aiida_mqtt_acl WHERE username = ? AND acl_type = 'ALLOW' AND action = ?;"
      publishAction: "PUBLISH"
      subscribeAction: "SUBSCRIBE"

# Kafka topics, users, storage type, and replication/ISR tuning.
kafka:
  # EDDIE's instance topics are generated automatically. Add custom topics here.
  topics: []
  # Additional users. The dedicated core application user is always created.
  users: []
  strimzi:
    metadataVersion: ""
    jvmOptions: {}
    additionalListeners: []
    entityOperator:
      topicOperator: {}
      userOperator: {}
    storage:
      type: "persistent-claim"
    offsetsTopicReplicationFactor: 1
    transactionStateLogReplicationFactor: 1
    transactionStateLogMinIsr: 1
    defaultReplicationFactor: 1
    minInsyncReplicas: 1

