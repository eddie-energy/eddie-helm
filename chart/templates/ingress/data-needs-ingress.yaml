{{- $auth := .Values.core.auth }}
{{- $management := .Values.core.dataNeedsConfig.management }}
{{- if and (eq (toString .Values.ingress.enabled) "true") (eq .Values.core.dataNeedsConfig.datasource "database") (eq (include "eddie.management.ingress.enabled" .) "true") }}
{{- $useTraefikAuth := and (eq (toString $auth.enabled) "true") (eq (default "traefik" $auth.provider) "traefik") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-data-needs-ingress
  {{- include "eddie.core.labels" . | indent 2 }}
  {{- include "eddie.ingress.annotations" (dict "root" . "annotations" $management.ingress.annotations "auth" $useTraefikAuth) | nindent 2 }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - host: {{ include "eddie.publicHost" . | quote }}
      http:
        paths:
          - path: {{ include "eddie.contextPath" . }}/data-needs/{{ include "eddie.management.urlPrefix" . }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-core
                port:
                  number: 9090
  {{- include "eddie.ingress.tls" . | nindent 2 }}
{{- end }}
