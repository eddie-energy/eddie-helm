{{- if and (eq (include "eddie.auth.managed" .) "true") (not .Values.core.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eddie.auth.secretName" . }}
  {{- include "eddie.core.labels" . | indent 2 }}
type: Opaque
data:
  {{- if .Values.core.auth.htpasswd }}
  users: {{ .Values.core.auth.htpasswd | b64enc | quote }}
  {{- else }}
  {{- /* Plaintext inputs get fresh BCrypt salts each render; use htpasswd for stable records. */}}
  {{- $lines := list }}
  {{- range .Values.core.auth.users }}
  {{- $lines = append $lines (htpasswd .name .password) }}
  {{- end }}
  users: {{ join "\n" $lines | b64enc | quote }}
  {{- end }}
{{- end }}
