{{- $admin := .Values.outboundConnectors.adminConsole }}
{{- if and (eq (toString .Values.ingress.enabled) "true") (eq (toString $admin.enabled) "true") (eq (toString $admin.access.ingress.enabled) "true") }}
{{- $useTraefikAuth := and (eq (toString $admin.access.auth.enabled) "true") (eq (default "traefik" $admin.access.auth.provider) "traefik") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-admin-console-ingress
  {{- include "eddie.core.labels" . | indent 2 }}
  {{- include "eddie.ingress.annotations" (dict "root" . "annotations" $admin.access.ingress.annotations "auth" $useTraefikAuth) | nindent 2 }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - host: {{ include "eddie.publicHost" . | quote }}
      http:
        paths:
          - path: {{ include "eddie.adminConsole.path" . }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-core
                port:
                  number: 9090
  {{- include "eddie.ingress.tls" . | nindent 2 }}
{{- end }}
