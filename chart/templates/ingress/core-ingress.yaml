{{- if eq (toString .Values.ingress.enabled) "true" }}
{{- $annotations := deepCopy (.Values.ingress.annotations | default dict) }}
{{- if and (eq (toString .Values.ingress.tls.enabled) "true") .Values.ingress.tls.clusterIssuer (not .Values.ingress.tls.existingSecret) }}
{{- $_ := set $annotations "cert-manager.io/cluster-issuer" .Values.ingress.tls.clusterIssuer }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  {{- include "eddie.core.labels" . | indent 2 }}
  {{- include "eddie.ingress.annotations" (dict "root" . "annotations" $annotations) | nindent 2 }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - host: {{ include "eddie.publicHost" . | quote }}
      http:
        paths:
          - path: {{ include "eddie.contextPath" . }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-core
                port:
                  number: 8080
          {{- if eq (toString .Values.outboundConnectors.rest.enabled) "true" }}
          - path: {{ include "eddie.contextPath" . }}/outbound-connectors/rest
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-core
                port:
                  number: 9090
          {{- end }}
  {{- include "eddie.ingress.tls" . | nindent 2 }}
{{- end }}
