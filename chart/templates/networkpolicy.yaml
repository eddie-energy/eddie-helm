{{- if eq (toString .Values.networkPolicy.enabled) "true" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "eddie.resourceName" (dict "root" . "suffix" "workloads") }}
  {{- include "eddie.core.labels" . | indent 2 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
        {{- if ne (include "eddie.kafka.externalEnabled" .) "true" }}
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ include "eddie.kafka.strimzi.clusterName" . }}
        {{- end }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
{{- end }}
