{{- if and (not .Values.mqtt.existingSecret) (eq (include "eddie.mqtt.broker" .) "hivemq") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eddie.mqtt.secretName" . }}
  {{- include "eddie.hivemq.labels" . | indent 2 }}
type: Opaque
stringData:
  dbPassword: {{ .Values.mqtt.db.password | quote }}
  mqttPassword: {{ .Values.regionConnectors.aiida.mqtt.password | quote }}
{{- end }}
