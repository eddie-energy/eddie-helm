{{- $broker := include "eddie.mqtt.broker" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eddie.mqtt.serviceName" . }}
{{- include "eddie.mqtt.labels" . | indent 2 }}
spec:
  selector:
    app: {{ .Release.Name }}-{{ $broker }}
  ports:
    - name: mqtt
      port: 1883
      protocol: TCP
      targetPort: mqtt
    {{- if eq (include "eddie.mqtt.externalTlsEnabled" .) "true" }}
    - name: mqttssl
      port: 8883
      protocol: TCP
      targetPort: mqttssl
    {{- end }}
