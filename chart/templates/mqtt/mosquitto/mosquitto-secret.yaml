{{- if and (not .Values.mqtt.existingSecret) (eq (default "mosquitto" .Values.mqtt.broker) "mosquitto") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eddie.mqtt.secretName" . }}
  {{- include "eddie.mosquitto.labels" . | indent 2 }}
type: Opaque
stringData:
  dbPassword: {{ .Values.mqtt.db.password | quote }}
  mqttPassword: {{ .Values.regionConnectors.aiida.mqtt.password | quote }}
{{- end }}
