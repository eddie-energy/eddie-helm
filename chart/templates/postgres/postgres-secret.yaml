{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eddie.postgres.secretName" . }}
  {{- include "eddie.postgres.labels" . | indent 2 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password | quote }}



{{- end }}
