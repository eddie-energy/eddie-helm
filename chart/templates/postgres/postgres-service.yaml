{{- if eq (toString .Values.postgres.enabled) "true" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  {{- include "eddie.postgres.labels" . | indent 2 }}
spec:
  selector:
    app: {{ .Release.Name }}-postgres
  ports:
    - port: {{ .Values.postgres.port }}

      targetPort: postgres
{{- end }}
