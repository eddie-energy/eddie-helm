{{- $kafka := include "eddie.componentValues" (dict "root" . "component" "kafka") | fromYaml }}
{{- $clusterName := include "eddie.kafka.strimzi.clusterName" . }}
{{- $adminUserName := include "eddie.kafka.adminUserName" . }}
{{- $coreUserName := include "eddie.kafka.coreUserName" . }}
{{- $eddieId := default (include "eddie.eddieId" .) .Values.outboundConnectors.kafka.eddieId }}
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: {{ $adminUserName }}
  labels:
    strimzi.io/cluster: {{ $clusterName }}
    app: {{ .Release.Name }}-kafka
{{ include "eddie.labels" . | indent 2 }}
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: cluster
          name: kafka-cluster
          patternType: literal
        operations:
          - All
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations:
          - All
      - resource:
          type: group
          name: "*"
          patternType: literal
        operations:
          - All
      - resource:
          type: transactionalId
          name: "*"
          patternType: literal
        operations:
          - All
---
{{/* The application can access its own instance's topics and fixed upstream consumer groups. */}}
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: {{ $coreUserName }}
  labels:
    strimzi.io/cluster: {{ $clusterName }}
    app: {{ .Release.Name }}-kafka
{{ include "eddie.labels" . | indent 2 }}
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: cluster
        operations:
          - IdempotentWrite
      {{- range $prefix := list "ep" "fw" }}
      - resource:
          type: topic
          name: {{ printf "%s.%s." $prefix $eddieId | quote }}
          patternType: prefix
        operations:
          - Read
          - Write
          - Create
          - Describe
      {{- end }}
      {{- range $group := list "termination-group" "retransmission-group" "permission-command-group" "min-max-envelope-group" "opaque-envelope-group" }}
      - resource:
          type: group
          name: {{ $group | quote }}
          patternType: literal
        operations:
          - Read
      {{- end }}
---
{{- range $kafka.users }}
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: {{ include "eddie.kafka.userName" (dict "root" $ "name" .name) }}
  labels:
    strimzi.io/cluster: {{ $clusterName }}
    app: {{ $.Release.Name }}-kafka
{{ include "eddie.labels" $ | indent 2 }}
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: {{ printf "fw.%s." $eddieId | quote }}
          patternType: prefix
        operations:
          - Read
          - Write
          - Create
          - Describe
      - resource:
          type: topic
          name: {{ printf "ep.%s." $eddieId | quote }}
          patternType: prefix
        operations:
          - Read
          - Write
          - Create
          - Describe
      - resource:
          type: group
          name: {{ .name | quote }}
          patternType: prefix
        operations:
          - Read
      {{- range .consumeTopics }}
      - resource:
          type: topic
          name: {{ .name | quote }}
          patternType: prefix
        operations:
          - Read
          - Describe
      - resource:
          type: group
          name: {{ .group | quote }}
          patternType: literal
        operations:
          - Read
      {{- end }}
      {{- range .produceTopics }}
      - resource:
          type: topic
          name: {{ .name | quote }}
          patternType: prefix
        operations:
          - Write
          - Create
          - Describe
      {{- end }}
---
{{- end }}
{{- $topics := list
  "ep.%s.agnostic.raw-data-message"
  "ep.%s.agnostic.connection-status-message"
  "ep.%s.cim_0_82.permission-md"
  "ep.%s.cim_0_82.validated-historical-data-md"
  "ep.%s.cim_1_04.validated-historical-data-md"
  "ep.%s.cim_1_04.near-real-time-data-md"
  "ep.%s.cim_1_12.near-real-time-data-md"
  "ep.%s.cim_1_12.acknowledgement-md"
  "ep.%s.cim_0_82.accounting-point-md"
  "ep.%s.cim_1_12.min-max-envelope-md"
  "ep.%s.agnostic.opaque-envelope"
  "ep.%s.cim_1_12.energy-sharing-reference-data-md"
  "ep.%s.cim_1_12.request-permission-md"
  "fw.%s.cim_0_82.termination-md"
  "fw.%s.cim_0_91_08.redistribution-transaction-rd"
  "fw.%s.agnostic.permission-command"
  "fw.%s.cim_1_12.min-max-envelope-md"
  "fw.%s.agnostic.opaque-envelope"
}}
{{- range $topicPattern := $topics }}
{{- $topicName := printf $topicPattern $eddieId }}
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ include "eddie.kafka.topicResourceName" (dict "root" $ "name" $topicName) }}
  labels:
    strimzi.io/cluster: {{ $clusterName }}
    app: {{ $.Release.Name }}-kafka
{{ include "eddie.labels" $ | indent 2 }}
spec:
  topicName: {{ $topicName | quote }}
  partitions: 1
  replicas: {{ $kafka.strimzi.defaultReplicationFactor | default 1 }}
---
{{- end }}
{{- range $kafka.topics }}
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ include "eddie.kafka.topicResourceName" (dict "root" $ "name" .name) }}
  labels:
    strimzi.io/cluster: {{ $clusterName }}
    app: {{ $.Release.Name }}-kafka
{{ include "eddie.labels" $ | indent 2 }}
spec:
  topicName: {{ .name | quote }}
  partitions: {{ .partitions }}
  replicas: {{ .replicationFactor }}
---
{{- end }}
