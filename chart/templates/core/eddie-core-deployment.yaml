{{- $core := include "eddie.componentValues" (dict "root" . "component" "core") | fromYaml }}
{{- $connectors := include "eddie.componentValues" (dict "root" . "component" "regionConnectors") | fromYaml }}
{{- $dataNeedsFromConfig := eq $core.dataNeedsConfig.datasource "config" }}
{{- $aiidaEnabled := eq (toString $connectors.aiida.enabled) "true" }}
{{- $pontonEnabled := eq (toString $connectors.ponton.enabled) "true" }}
{{- $pontonTrustEnabled := and $pontonEnabled (eq (toString $connectors.ponton.tls.truststore.enabled) "true") }}
{{- $fingridEnabled := eq (toString $connectors.fiFingrid.enabled) "true" }}
{{- $mijnAansluitingEnabled := eq (toString $connectors.nlMijnAansluiting.enabled) "true" }}
{{- $fluviusTlsSecretName := $connectors.beFluvius.tls.existingSecret }}
{{- $fluviusTlsEnabled := and (eq (toString $connectors.beFluvius.enabled) "true") $fluviusTlsSecretName }}
{{- $postgresRootCertEnabled := not (empty (include "eddie.postgres.sslRootCertPath" .)) }}
{{- $coreHasMounts := or $dataNeedsFromConfig $aiidaEnabled $pontonEnabled $fingridEnabled $mijnAansluitingEnabled $fluviusTlsEnabled $postgresRootCertEnabled }}
{{- /* The SQL volume belongs to the provisioning init container, not the core container. */}}
{{- $provisionMqttRole := eq (toString .Values.mqtt.provisioning.enabled) "true" }}
{{- $podHasVolumes := or $coreHasMounts $provisionMqttRole }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-core
  {{- include "eddie.core.labels" . | indent 2 }}
spec:
  replicas: {{ $core.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-core
  template:
    metadata:
      annotations:
        {{- with $core.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/secret: {{ include (print $.Template.BasePath "/core/eddie-core-secret.yaml") . | sha256sum }}
        checksum/secret-postgres: {{ include (print $.Template.BasePath "/postgres/postgres-secret.yaml") . | sha256sum }}
        checksum/secret-region-connectors: {{ include (print $.Template.BasePath "/core/eddie-region-connector-secrets.yaml") . | sha256sum }}
        checksum/data-needs: {{ include (print $.Template.BasePath "/core/data-needs-configmap.yaml") . | sha256sum }}
        checksum/mqtt: {{ dict "db" .Values.mqtt.db "secret" .Values.mqtt.existingSecret "aiida" $connectors.aiida.mqtt | toJson | sha256sum }}
        checksum/provision: {{ include (print $.Template.BasePath "/postgres/postgres-provision-configmap.yaml") . | sha256sum }}
        checksum/ponton-trust-config: {{ include (print $.Template.BasePath "/core/eddie-core-ponton-trust-configmap.yaml") . | sha256sum }}
    {{- include "eddie.core.labels" . | indent 6 }}
    spec:
      automountServiceAccountToken: false
      {{- include "eddie.podScheduling" $core | nindent 6 }}
      {{- with $core.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or $provisionMqttRole $pontonTrustEnabled }}
      initContainers:
        {{- include "eddie.postgres.provisionInitContainer" . | nindent 8 }}
        {{- if $pontonTrustEnabled }}
        - name: ponton-truststore-init
          image: "{{ $core.image }}:{{ $core.version }}"
          {{- with $core.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - sh
            - -c
            - |
              set -eu
              cp "$JAVA_HOME/lib/security/cacerts" /opt/ponton-truststore/ponton-truststore.p12
              keytool -importcert \
                -alias ponton-xp-root-ca \
                -file /opt/ponton-trust-source/ponton-ca.pem \
                -keystore /opt/ponton-truststore/ponton-truststore.p12 \
                -storetype PKCS12 \
                -storepass changeit \
                -noprompt
          volumeMounts:
            - name: ponton-trust-source
              mountPath: /opt/ponton-trust-source
            - name: ponton-truststore
              mountPath: /opt/ponton-truststore
        {{- end }}
      {{- end }}
      {{- with $core.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: eddie-core
          image: "{{ $core.image }}:{{ $core.version }}"
          {{- if $coreHasMounts }}
          volumeMounts:
            {{- if $dataNeedsFromConfig }}
            - name: data-needs-volume
              mountPath: /opt/core/config/data-needs.json
              subPath: data-needs.json
            {{- end }}
            {{- if $aiidaEnabled }}
            - name: aiida-mqtt-persistence
              mountPath: /opt/core/region-connector-aiida/mqtt-persistence
            {{- end }}
            {{- include "eddie.postgres.sslRootCertMount" . | nindent 12 }}
            {{- if $pontonEnabled }}
            - name: ponton
              mountPath: {{ $connectors.ponton.folder }}
            {{- end }}
            {{- if $pontonTrustEnabled }}
            - name: ponton-truststore
              mountPath: /opt/ponton-truststore
              readOnly: true
            {{- end }}
            {{- include "eddie.region-connectors.fi-fingrid.volumeMount" . | indent 12 }}
            {{- include "eddie.region-connectors.nl-mijn-aansluiting.volumeMount" . | indent 12 }}
            {{- include "eddie.region-connectors.be-fluvius.volumeMount" . | indent 12 }}
          {{- end }}
          ports:
            - containerPort: 8080
              name: api
            - containerPort: 9090
              name: outbound
          {{- with $core.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "eddie.probes" $core | nindent 10 }}
          resources:
            {{- include "eddie.resources" $core.resources | nindent 12 }}
          env:
            - name: EDDIE_PUBLIC_URL
              value: "{{ include "eddie.publicUrl" . }}"
            - name: EDDIE_JWT_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "eddie.core.secretName" . }}
                  key: jwtHmacSecret
            - name: EDDIE_DATA_NEEDS_CONFIG_DATA_NEED_SOURCE
              value: {{ $core.dataNeedsConfig.datasource }}
            {{- if $dataNeedsFromConfig }}
            - name: EDDIE_DATA_NEEDS_CONFIG_FILE
              value: "./config/data-needs.json"
            {{- end }}
            - name: LOGGING_LEVEL_ROOT
              value: {{ $core.logLevel | quote }}
            - name: EDDIE_DEMO_BUTTON_ENABLED
              value: {{ $core.demoButton | quote }}
            - name: SPRING_DATASOURCE_URL
              value: {{ include "eddie.postgres-url" . }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "eddie.postgres.secretName" . }}
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "eddie.postgres.secretName" . }}
                  key: password
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: {{ if .Values.ingress.basePath }}/{{ .Values.ingress.basePath }}{{ end }}/eddie
            - name: REGION_CONNECTOR_SIM_ENABLED
              value: {{ $connectors.simulation.enabled | quote }}
            {{- include "eddie.region-connectors.cds.envs" . | indent 12 }}
            {{- include "eddie.region-connectors.aiida.envs" . | indent 12  }}
            {{- include "eddie.region-connectors.at-eda.envs" . | indent 12 }}
            {{- include "eddie.region-connectors.be-fluvius.envs" . | indent 12 }}
            {{- include "eddie.region-connectors.de-eta.envs" . | indent 12 }}
            {{- include "eddie.region-connectors.dk-energinet.envs" . | indent 12 }}
            {{- include "eddie.region-connectors.fr-enedis.envs" . | indent 12 }}
            {{- include "eddie.region-connectors.es-datadis.envs" . | indent 12 }}
            {{- include "eddie.region-connectors.us-green-button.envs" . | indent 12 }}
            {{- include "eddie.region-connectors.nl-mijn-aansluiting.envs" . | indent 12 }}
            {{- include "eddie.region-connectors.fi-fingrid.envs" . | indent 12 }}
            {{- include "eddie.region-connectors.si-moj-elektro.envs" . | indent 12 }}
            {{- include "eddie.outbound-connectors.management.envs" . | indent 12 }}
            {{- include "eddie.outbound-connectors.admin-console.envs" . | indent 12 }}
            {{- include "eddie.outbound-connectors.kafka.envs" . | indent 12 }}
            {{- include "eddie.outbound-connectors.amqp.envs" . | indent 12 }}
            {{- include "eddie.outbound-connectors.rest.envs" . | indent 12 }}
            {{- include "eddie.outbound-connectors.metric.envs" . | indent 12 }}
            - name: JAVA_OPTS
              value: "--add-opens java.base/java.net=ALL-UNNAMED"
            {{- if $pontonTrustEnabled }}
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Djavax.net.ssl.trustStore=/opt/ponton-truststore/ponton-truststore.p12
                -Djavax.net.ssl.trustStoreType=PKCS12
            {{- end }}

      {{- if $podHasVolumes }}
      volumes:
        {{- if $provisionMqttRole }}
        - name: postgres-provision
          configMap:
            name: {{ include "eddie.resourceName" (dict "root" . "suffix" "postgres-provision") }}
        {{- end }}
        {{- if $dataNeedsFromConfig }}
        - name: data-needs-volume
          configMap:
            name: {{ include "eddie.dataNeeds.configMapName" . }}
        {{- end }}
        {{- if $aiidaEnabled }}
        # Paho writes this directory relative to the application's /opt/core working directory.
        - name: aiida-mqtt-persistence
          emptyDir: {}
        {{- end }}
        {{- include "eddie.postgres.sslRootCertVolume" . | nindent 8 }}
        {{- if $pontonEnabled }}
        - name: ponton
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-core-ponton-pvc
        {{- end }}
        {{- if $pontonTrustEnabled }}
        - name: ponton-trust-source
          configMap:
            name: {{ .Release.Name }}-ponton-trust-config
        - name: ponton-truststore
          emptyDir: {}
        {{- end }}
        {{- include "eddie.region-connectors.fi-fingrid.volume" . | indent 8 }}
        {{- include "eddie.region-connectors.nl-mijn-aansluiting.volume" . | indent 8 }}
        {{- include "eddie.region-connectors.be-fluvius.volume" . | indent 8 }}
      {{- end }}
