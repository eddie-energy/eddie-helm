{{- $connectors := include "eddie.componentValues" (dict "root" . "component" "regionConnectors") | fromYaml }}
{{- $hasSecrets := false }}
{{- range $connector := list "ponton" "esDatadis" "frEnedis" "fiFingrid" "nlMijnAansluiting" "usGreenButton" "beFluvius" "deEta" }}
{{- if eq (toString (index $connectors $connector).enabled) "true" }}{{- $hasSecrets = true }}{{- end }}
{{- end }}
{{- if and $hasSecrets (not $connectors.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eddie.connectors.secretName" . }}
  {{- include "eddie.core.labels" . | indent 2 }}
type: Opaque
stringData:
  {{- if eq (toString $connectors.ponton.enabled) "true" }}
  pontonUsername: {{ $connectors.ponton.username | quote }}
  pontonPassword: {{ $connectors.ponton.password | quote }}
  {{- end }}
  {{- if eq (toString $connectors.esDatadis.enabled) "true" }}
  datadisUsername: {{ $connectors.esDatadis.username | quote }}
  datadisPassword: {{ $connectors.esDatadis.password | quote }}
  {{- end }}
  {{- if eq (toString $connectors.frEnedis.enabled) "true" }}
  enedisClientId: {{ required "regionConnectors.frEnedis.client.id is required when the FR Enedis connector is enabled" $connectors.frEnedis.client.id | quote }}
  enedisClientSecret: {{ required "regionConnectors.frEnedis.client.secret is required when the FR Enedis connector is enabled" $connectors.frEnedis.client.secret | quote }}
  {{- end }}
  {{- if eq (toString $connectors.fiFingrid.enabled) "true" }}
  fingridOrganisationUser: {{ $connectors.fiFingrid.organisation.user | quote }}
  fingridKeystorePassword: {{ $connectors.fiFingrid.keystore.password | quote }}
  fingridKeyAlias: {{ $connectors.fiFingrid.keystore.keyAlias | quote }}
  fingridKeyPassword: {{ $connectors.fiFingrid.keystore.keyPassword | quote }}
  {{- end }}
  {{- if eq (toString $connectors.nlMijnAansluiting.enabled) "true" }}
  mijnAansluitingContinuousKeyId: {{ $connectors.nlMijnAansluiting.continuous.keyId | quote }}
  mijnAansluitingCodeboekApiToken: {{ $connectors.nlMijnAansluiting.codeboekApiToken | quote }}
  mijnAansluitingKeystorePassword: {{ $connectors.nlMijnAansluiting.keystore.password | quote }}
  mijnAansluitingKeyAlias: {{ $connectors.nlMijnAansluiting.keystore.keyAlias | quote }}
  mijnAansluitingKeyPassword: {{ $connectors.nlMijnAansluiting.keystore.keyPassword | quote }}
  {{- end }}
  {{- if eq (toString $connectors.usGreenButton.enabled) "true" }}
  greenButtonWebhookSecret: {{ $connectors.usGreenButton.webhookSecret | quote }}
  {{- range $connectors.usGreenButton.clients }}
  greenButton{{ .name }}Id: {{ .clientId | quote }}
  greenButton{{ .name }}ClientSecret: {{ .clientSecret | quote }}
  greenButton{{ .name }}Token: {{ .token | quote }}
  {{- end }}
  {{- end }}
  {{- if eq (toString $connectors.beFluvius.enabled) "true" }}
  fluviusOAuthClientId: {{ $connectors.beFluvius.oauth.clientId | quote }}
  fluviusOAuthClientSecret: {{ $connectors.beFluvius.oauth.clientSecret | quote }}
  fluviusSubscriptionKey: {{ $connectors.beFluvius.subscriptionKey | quote }}
  {{- end }}
  {{- if eq (toString $connectors.deEta.enabled) "true" }}
  etaApiClientId: {{ $connectors.deEta.apiClientId | quote }}
  etaApiClientSecret: {{ $connectors.deEta.apiClientSecret | quote }}
  etaAuthClientId: {{ $connectors.deEta.auth.clientId | quote }}
  etaAuthClientSecret: {{ $connectors.deEta.auth.clientSecret | quote }}
  {{- end }}

{{- end }}
