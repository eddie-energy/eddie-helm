apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-core
  {{- include "eddie.core.labels" . | indent 2 }}
spec:
  selector:
    app: {{ .Release.Name }}-core
  ports:
    - name: api
      port: 8080
      targetPort: 8080
    - name: outbound
      port: 9090
      targetPort: 9090
