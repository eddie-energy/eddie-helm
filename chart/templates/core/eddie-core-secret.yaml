{{- if not .Values.core.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eddie.core.secretName" . }}
  {{- include "eddie.core.labels" . | indent 2 }}
type: Opaque
stringData:
  # EDDIE expects Base64 text inside the Secret; the chart value is raw text.
  jwtHmacSecret: {{ .Values.core.jwtHmacSecret | b64enc | quote }}
  adminConsolePassword: {{ .Values.outboundConnectors.adminConsole.login.encodedPassword | default "" | quote }}
  keycloakClientSecret: {{ .Values.outboundConnectors.adminConsole.login.keycloakClientSecret | quote }}
  amqpUri: {{ .Values.outboundConnectors.amqp.uri | quote }}
{{- end }}
